[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
google-genai = "^2.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.15.0"
ipykernel = "^7.3.0"
jupyterlab = "^4.6.3"
jupyter-collaboration = "^5.0.3"
pillow = "^12.3.0"
opencv-python = "^5.0.0.93"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = "(^tests/)"
