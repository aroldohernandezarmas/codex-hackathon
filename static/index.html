<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watcher</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Watcher</h1>
    <p class="tagline">Point the camera. Say what should happen. Get told when it does.</p>
  </header>

  <div class="workspace">
  <section class="stage">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <button id="flip" type="button" class="flip" hidden aria-label="Switch camera" title="Switch camera">⟳</button>
      <div class="hud">
        <span id="gate" class="pill pill-idle">camera off</span>
        <span id="state" class="pill pill-idle">no rule</span>
      </div>
    </div>

    <form id="ruleForm" class="rule">
      <label for="rule">Tell me when…</label>
      <div class="row">
        <input id="rule" type="text" placeholder="the cat jumps onto the table" autocomplete="off" required>
        <button id="start" type="submit">Watch</button>
        <button id="stop" type="button" class="secondary" hidden>Stop</button>
      </div>
      <p id="reading" class="reading" hidden></p>
      <p id="status" class="status">Allow the camera to begin.</p>
      <p class="usage">tokens: <span id="usage">0</span>
        <button id="resetUsage" type="button" class="secondary" hidden>reset</button>
      </p>
      <label class="slider">every <output id="sampleValue">1</output>s
        <input id="sample" type="range" min="1000" max="10000" step="1000" value="1000">
      </label>
    </form>
  </section>

  <aside id="notify" class="notify" hidden>
    <h2>Notify my phone</h2>
    <a id="qrLink" class="qr" target="_blank" rel="noopener">
      <img id="qrImg" alt="">
      <span id="qrFallback" class="qr-fallback" hidden>Open in Telegram</span>
    </a>
    <span id="qrBadge" class="pill pill-idle">not linked</span>
    <p id="qrHint" class="qr-hint">Scan to get events in Telegram.</p>
  </aside>
  </div>

  <section class="log">
    <h2>What happened</h2>
    <p id="evidence" class="evidence">—</p>
    <ol id="events" class="events"></ol>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
